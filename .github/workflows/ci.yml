name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, feat/**]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies (with dev extras)
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check app/ tests/

      - name: Ruff format check
        run: uv run ruff format app/ tests/ --check

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # App secrets (dummy values — no real services in unit/integration tests)
      SECRET_KEY: "ci-secret-key-for-testing-only-32chars!!"
      GROQ_API_KEY: "gsk_dummy"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aurynix
      POSTGRES_USER: aurynix
      POSTGRES_PASSWORD: testpassword
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: aurynix_docs
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      EMBEDDING_DIMENSIONS: "384"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies (with dev extras)
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short

      - name: Coverage report
        run: |
          uv run pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            -q
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
