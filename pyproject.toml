[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurynix-nexus"
version = "0.1.0"
description = "AI-powered business assistant with RAG, memory, and multi-agent workflows"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",

    # LangGraph / LangChain
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-groq>=0.2",
    "langchain-community>=0.3",
    "langchain-qdrant>=0.2",
    "langchain-core>=0.3",

    # Database — PostgreSQL
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary,pool]>=3.1",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",

    # Cache
    "redis>=5.0",

    # Vector DB
    "qdrant-client[fastembed]>=1.12",

    # Auth
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",

    # Config / Settings
    "pydantic-settings>=2.5",
    "pydantic[email]>=2.0",

    # Logging
    "structlog>=24.0",

    # Document loaders
    "pypdf>=4.0",
    "python-docx>=1.1",
    "docx2txt>=0.8",

    # Utils
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
